<style>
@font-face{font-family:Marcellus;src:url(assets/fonts/Marcellus-latin.woff2) format("woff2");font-display:swap}
@font-face{font-family:Instrument;src:url(assets/fonts/InstrumentSans-normal-400_600.woff2) format("woff2");font-weight:400 600;font-display:swap}
:root{--grund:#f3f1ea;--tinte:#0b2a32;--petrol:#015967;--leise:rgba(11,42,50,.6)}
*{box-sizing:border-box}
body{margin:0;background:var(--grund);color:var(--tinte);font-family:Instrument,system-ui,sans-serif;font-size:15px;line-height:1.5}
.kopf{position:sticky;top:0;z-index:5;background:rgba(243,241,234,.96);border-bottom:1px solid rgba(1,89,103,.1)}
.kopf__in{max-width:1680px;margin:0 auto;padding:18px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
h1{font-family:Marcellus,serif;font-weight:400;font-size:1.7rem;margin:0;margin-right:auto;line-height:1.1}
h1 small{display:block;font-family:Instrument,sans-serif;font-size:13px;color:var(--leise);margin-top:4px}
.farben{display:flex;gap:6px;flex-wrap:wrap}
.farben button{font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:30px;border:0;background:#fff;color:var(--tinte);box-shadow:0 0 0 1px rgba(1,89,103,.14);cursor:pointer}
.farben button i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.farben button[aria-pressed=true]{background:var(--tinte);color:#fff}
main{max-width:1680px;margin:0 auto;padding:26px 24px 80px}
.zeile{display:grid;grid-template-columns:220px repeat(7,minmax(0,1fr));gap:10px;align-items:stretch;margin-bottom:10px}
.name{padding:6px 10px 0 0}
.name b{font-family:Marcellus,serif;font-weight:400;font-size:1.15rem;display:block;line-height:1.2}
.name b span{color:var(--petrol);margin-right:6px}
.name p{margin:4px 0 0;color:var(--leise);font-size:13px;line-height:1.45}
.fl{display:block;width:100%;aspect-ratio:1;border:0;border-radius:14px;cursor:zoom-in;background-repeat:repeat;background-position:0 0;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.kopfzeile{display:grid;grid-template-columns:220px repeat(7,minmax(0,1fr));gap:10px;margin-bottom:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--leise)}
.gross{display:none;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.gross figure{margin:0}.gross .fl{aspect-ratio:4/3;border-radius:18px}
.gross figcaption{padding:8px 4px 0;font-size:14px}.gross figcaption b{font-family:Marcellus,serif;font-weight:400;font-size:1.05rem;margin-right:6px}
.gross figcaption span{color:var(--petrol);margin-right:4px}
body.eine .alle{display:none}body.eine .gross{display:grid}
.voll{position:fixed;inset:0;z-index:20;display:none;cursor:zoom-out;background-repeat:repeat}
.voll.an{display:block}
.voll__z{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(255,255,255,.94);color:var(--tinte);padding:10px 18px;border-radius:30px;font-size:14px;white-space:nowrap;box-shadow:0 10px 30px -12px rgba(0,0,0,.4)}
.voll__z b{font-family:Marcellus,serif;font-weight:400;font-size:1.05rem;margin-right:8px}
@media (max-width:900px){.zeile,.kopfzeile{grid-template-columns:repeat(4,minmax(0,1fr))}.name{grid-column:1/-1}.kopfzeile span:first-child{display:none}.kopfzeile{display:none}.kopf__in,main{padding-left:16px;padding-right:16px}}

const bild=(m,f)=>`background-color:${f[2]};background-image:url(${f[3]==='h'?m.h:m.d});background-size:${m.w}px auto`;
let farbe=null;
try{farbe=localStorage.getItem('tk-farbe')}catch(e){}
const fb=document.getElementById('farben');
fb.innerHTML=`<button type="button" data-f="">Alle Farben</button>`+F.map(f=>`<button type="button" data-f="${f[0]}"><i style="background:${f[2]}"></i>${f[1]}</button>`).join('');
document.getElementById('kopfzeile').innerHTML='<span></span>'+F.map(f=>`<span>${f[1]}</span>`).join('');
document.getElementById('zeilen').innerHTML=M.map((m,i)=>`<div class="zeile"><div class="name"><b><span>${m.nr}</span>${m.name}</b><p>${m.satz}</p></div>`+F.map((f,j)=>`<button class="fl" type="button" data-m="${i}" data-f="${j}" aria-label="${m.name}, ${f[1]}" style="${bild(m,f)}"></button>`).join('')+'</div>').join('');
function setze(f){farbe=f||null;try{f?localStorage.setItem('tk-farbe',f):localStorage.removeItem('tk-farbe')}catch(e){}
 document.body.classList.toggle('eine',!!farbe);fb.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.f||null)===farbe));
 if(farbe){const j=F.findIndex(x=>x[0]===farbe),f2=F[j];document.getElementById('gross').innerHTML=M.map((m,i)=>`<figure><button class="fl" type="button" data-m="${i}" data-f="${j}" aria-label="${m.name}" style="${bild(m,f2)}"></button><figcaption><b><span>${m.nr}</span>${m.name}</b></figcaption></figure>`).join('')}}
fb.onclick=e=>{const b=e.target.closest('button');if(b)setze(b.dataset.f)};
const voll=document.getElementById('voll'),vz=document.getElementById('vollz');let vm=0,vf=0;
function zeig(){const m=M[vm],f=F[vf];voll.setAttribute('style',bild(m,f));vz.innerHTML=`<b>${m.nr} ${m.name}</b>${f[1]} · ← → Muster · ↑ ↓ Farbe · Esc`;voll.classList.add('an')}
document.addEventListener('click',e=>{const b=e.target.closest('.fl');if(b){vm=+b.dataset.m;vf=+b.dataset.f;zeig()}});
voll.onclick=()=>voll.classList.remove('an');
document.addEventListener('keydown',e=>{if(!voll.classList.contains('an'))return;
 if(e.key==='Escape')voll.classList.remove('an');
 if(e.key==='ArrowRight'){vm=(vm+1)%M.length;zeig()}if(e.key==='ArrowLeft'){vm=(vm-1+M.length)%M.length;zeig()}
 if(e.key==='ArrowDown'){vf=(vf+1)%F.length;zeig();e.preventDefault()}if(e.key==='ArrowUp'){vf=(vf-1+F.length)%F.length;zeig();e.preventDefault()}});
setze(farbe);
</script></body></html>
