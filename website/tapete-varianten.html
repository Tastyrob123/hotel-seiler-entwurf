<style>
body{background:var(--fassade);margin:0}
.kopf{max-width:1500px;margin:0 auto;padding:40px 24px 20px;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.kopf h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,3.4vw,3.2rem);margin:0;color:var(--tinte);line-height:1.05}
.kopf p{margin:0;color:rgba(11,42,50,.66);max-width:560px;font-size:16px}
.buehne{max-width:1500px;margin:0 auto;padding:0 24px}
.rahmen{border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(1,89,103,.08),0 30px 60px -30px rgba(11,42,50,.45)}
.rahmen iframe{display:block;width:100%;height:min(78vh,860px);border:0}
.wahl{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0;align-items:center}
.wahl button{font:inherit;font-size:14px;padding:9px 16px;border-radius:30px;border:0;background:#fff;color:var(--tinte);box-shadow:0 0 0 1px rgba(1,89,103,.14);cursor:pointer}
.wahl button[aria-pressed=true]{background:var(--petrol);color:#fff}
.wahl span{margin-left:auto;font-family:var(--serif);font-size:1.15rem;color:var(--petrol)}
.raster{max-width:1500px;margin:0 auto;padding:36px 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.tk{all:unset;cursor:pointer;display:grid;grid-template-rows:170px 64px auto auto;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#fff,#f3f0e8);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(1,89,103,.09),0 16px 30px -20px rgba(11,42,50,.45)}
.tk[aria-pressed=true]{box-shadow:0 0 0 2px var(--petrol),0 16px 30px -20px rgba(11,42,50,.45)}

.tk__t b{font-weight:400;color:var(--petrol);margin-right:6px}

<header class="kopf"><h1>Tapete,<br>zehn Vorschläge.</h1><p>Jede ist ein Gitter mit dem S aus der Wortmarke, Ton in Ton, hell und dunkel. Antippen legt sie oben auf die echte Seite.</p></header>
<div class="buehne"><div class="rahmen"><iframe id="f" src="index.html?nomotion#tag" title="Seite mit Tapete"></iframe></div>
<div class="wahl"><button type="button" data-z="tag" aria-pressed="true">Ein Tag am See (hell)</button><button type="button" data-z="geschichte">Geschichte (hell)</button><button type="button" data-z="angebote">Angebote (dunkel)</button><button type="button" data-z="fuss">Fuss (dunkel)</button><span id="name"></span></div></div>
<main class="raster"><button class="tk" data-n="0" type="button"><span class="tk__f" style="background-image:url(assets/img/tapete-hell.webp);background-size:440px auto"></span><span class="tk__d" style="background-image:url(assets/img/tapete-dunkel.webp);background-size:440px auto"></span><span class="tk__t"><b>·</b> Heute</span><span class="tk__s">Der Zwiebelbogen mit dem S, wie er jetzt auf der Seite liegt.</span></button><button class="tk" data-n="1" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/01-hell.webp);background-size:200px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/01-dunkel.webp);background-size:200px auto"></span><span class="tk__t"><b>1</b> Storen</span><span class="tk__s">Breite Streifen wie die Sonnenstoren über der Terrasse, im hellen Streifen das S.</span></button><button class="tk" data-n="2" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/02-hell.webp);background-size:256px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/02-dunkel.webp);background-size:256px auto"></span><span class="tk__t"><b>2</b> Schuppen</span><span class="tk__s">Fischschuppen für die Fischküche des Hauses. In jeder achten Schuppe liegt das S.</span></button><button class="tk" data-n="3" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/03-hell.webp);background-size:192px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/03-dunkel.webp);background-size:192px auto"></span><span class="tk__t"><b>3</b> Spalier</span><span class="tk__s">Ein Gartengitter aus Doppellinien, Rosetten an den Kreuzungen, das S in jeder zweiten Raute.</span></button><button class="tk" data-n="4" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/04-hell.webp);background-size:240px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/04-dunkel.webp);background-size:240px auto"></span><span class="tk__t"><b>4</b> Vierpass</span><span class="tk__s">Das Gitter der Gründerzeit, aus der das Caféhaus von 1873 stammt. S im Wechsel mit einer Rosette.</span></button><button class="tk" data-n="5" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/05-hell.webp);background-size:170px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/05-dunkel.webp);background-size:170px auto"></span><span class="tk__t"><b>5</b> Monogramm</span><span class="tk__s">Das S wie auf Hotelwäsche gestickt, im Versatz mit einem kleinen Stern. Das ruhigste der zehn.</span></button><button class="tk" data-n="6" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/06-hell.webp);background-size:220px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/06-dunkel.webp);background-size:220px auto"></span><span class="tk__t"><b>6</b> Medaillon</span><span class="tk__s">Ovale Rahmen wie auf der Ansichtskarte von 1910, darin das S, dazwischen feine Girlanden.</span></button><button class="tk" data-n="7" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/07-hell.webp);background-size:280px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/07-dunkel.webp);background-size:280px auto"></span><span class="tk__t"><b>7</b> Kursschiff</span><span class="tk__s">Das Schiff, das vor dem Haus anlegt, und das S im Wechsel. Erzählt die Ländte, ohne laut zu werden.</span></button><button class="tk" data-n="8" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/08-hell.webp);background-size:200px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/08-dunkel.webp);background-size:200px auto"></span><span class="tk__t"><b>8</b> Sonne</span><span class="tk__s">Ein Strahlenkranz um das S, für die Morgen- und die Abendsonne, mit der sich das Haus beschreibt.</span></button><button class="tk" data-n="9" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/09-hell.webp);background-size:150px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/09-dunkel.webp);background-size:150px auto"></span><span class="tk__t"><b>9</b> Pilaster</span><span class="tk__s">Schmale Felder wie die geschnitzten grünen Pilaster an der Fassade, mit Blattstab und dem S als Medaillon.</span></button><button class="tk" data-n="10" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten/10-hell.webp);background-size:240px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten/10-dunkel.webp);background-size:240px auto"></span><span class="tk__t"><b>10</b> Kassetten</span><span class="tk__s">Vertiefte Felder wie eine Holzdecke, in der Mitte das S oder eine Rosette. Passt zu den Kuhlen der Seite.</span></button></main>
