yle="background-color:#0b2a32;background-image:url(_varianten/tapeten5/30-d.webp);background-size:400px auto"></span><span class="tk__t"><b>30</b> Rauten fein</span><span class="tk__s">Schlanke Rauten aus Haarlinien, hoch gestellt.</span></button><button class="tk" data-n="31" type="button"><span class="tk__f" style="background-color:#f7f5ef;background-image:url(_varianten/tapeten5/r4-01-h.webp);background-size:400px auto"></span><span class="tk__d" style="background-color:#0b2a32;background-image:url(_varianten/tapeten5/r4-01-d.webp);background-size:400px auto"></span><span class="tk__t"><b>31</b> Leinen</span><span class="tk__s">Feines Leinen in Kette und Schuss. Ruhig, warm, sieht nach Stoff an der Wand aus.</span></button><button class="tk" data-n="32" type="button"><span class="tk__f" style="background-color:#f7f5ef;background-image:url(_varianten/tapeten5/r4-02-h.webp);background-size:400px auto"></span><span class="tk__d" style="background-color:#0b2a32;background-image:url(_varianten/tapeten5/r4-02-d.webp);background-size:400px auto"></span><span class="tk__t"><b>32</b> Grastapete</span><span class="tk__s">Gewebte Gräser quer, feine Kettfäden senkrecht. Die klassische Wand guter Hotels.</span></button><button class="tk" data-n="33" type="button"><span class="tk__f" style="background-color:#f7f5ef;background-image:url(_varianten/tapeten5/r4-03-h.webp);background-size:400px auto"></span><span class="tk__d" style="background-color:#0b2a32;background-image:url(_varianten/tapeten5/r4-03-d.webp);background-size:400px auto"></span><span class="tk__t"><b>33</b> Rohseide</span><span class="tk__s">Rohseide mit kleinen Verdickungen im Faden und weichem Glanz.</span></button><button class="tk" data-n="34" type="button"><span class="tk__f" style="background-color:#f7f5ef;background-image:url(_varianten/tapeten5/r4-04-h.webp);background-size:400px auto"></span><span class="tk__d" style="background-color:#0b2a32;background-image:url(_varianten/tapeten5/r4-04-d.webp);backgr linien, wie ein Parkett in Linie.</span></button><button class="tk" data-n="43" type="button"><span class="tk__f" style="background-color:#f7f5ef;background-image:url(_varianten/tapeten5/r4-13-h.webp);background-size:400px auto"></span><span class="tk__d" style="background-color:#0b2a32;background-image:url(_varianten/tapeten5/r4-13-d.webp);background-size:400px auto"></span><span class="tk__t"><b>43</b> Wellenringe</span><span class="tk__s">Ringe im Wasser von wenigen Stellen aus, die sich überlagern und auslaufen.</span></button><button class="tk" data-n="44" type="button"><span class="tk__f" style="background-color:#f7f5ef;background-image:url(_varianten/tapeten5/r4-14-h.webp);background-size:400px auto"></span><span class="tk__d" style="background-color:#0b2a32;background-image:url(_varianten/tapeten5/r4-14-d.webp);background-size:400px auto"></span><span class="tk__t"><b>44</b> Terrazzo</span><span class="tk__s">Ganz feiner Terrazzo, Splitter Ton in Ton. Wie ein Boden in der Halle, nur an der Wand.</span></button><button class="tk" data-n="45" type="button"><span class="tk__f" style="background-color:#f7f5ef;background-image:url(_varianten/tapeten5/r4-15-h.webp);background-size:400px auto"></span><span class="tk__d" style="background-color:#0b2a32;background-image:url(_varianten/tapeten5/r4-15-d.webp);background-size:400px auto"></span><span class="tk__t"><b>45</b> Bouclé</span><span class="tk__s">Bouclé-Stoff mit kleinen Schlaufen, weich und tief.</span></button><button class="tk" data-n="46" type="button"><span class="tk__f" style="background-color:#f7f5ef;background-image:url(_varianten/tapeten5/r4-16-h.webp);background-size:400px auto"></span><span class="tk__d" style="background-color:#0b2a32;background-image:url(_varianten/tapeten5/r4-16-d.webp);background-size:400px auto"></span><span class="tk__t"><b>46</b> Halbton</span><span class="tk__s">Punkte im Halbton, die in breiten Wellen grösser und kleiner werden.</span></button><button class="tk" data-n="47"
