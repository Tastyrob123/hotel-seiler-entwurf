<header class="kopf"><h1>Tapete, Runde 4.<br>Modern und ruhig.</h1><p>Keine Motive mehr: Stoff, Putz, Relief und Linie, Ton in Ton, hell und dunkel. Antippen legt sie oben auf die echte Seite.</p></header>
<div class="buehne"><div class="rahmen"><iframe id="f" src="index.html?nomotion#tag" title="Seite mit Tapete"></iframe></div>
<div class="wahl"><button type="button" data-z="tag" aria-pressed="true">Ein Tag am See</button><button type="button" data-z="geschichte">Geschichte (hell)</button><button type="button" data-z="angebote">Angebote (dunkel)</button><button type="button" data-z="fuss">Fuss (dunkel)</button><span id="name"></span></div></div>
<main class="raster"><button class="tk" data-n="0" type="button"><span class="tk__f" style="background-image:url(assets/img/tapete-hell.webp);background-size:440px auto"></span><span class="tk__d" style="background-image:url(assets/img/tapete-dunkel.webp);background-size:440px auto"></span><span class="tk__t"><b>·</b> Heute</span><span class="tk__s">Der Zwiebelbogen mit dem S, wie er jetzt auf der Seite liegt.</span></button><button class="tk" data-n="1" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/01-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/01-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>1</b> Leinen</span><span class="tk__s">Feines Leinen in Kette und Schuss. Ruhig, warm, sieht nach Stoff an der Wand aus.</span></button><button class="tk" data-n="2" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/02-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/02-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>2</b> Grastapete</span><span class="tk__s">Gewebte Gräser quer, feine Kettfäden senkrecht. Die klassische Wand guter Hotels.</span></button><button class="tk" data-n="3" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/03-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/03-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>3</b> Rohseide</span><span class="tk__s">Rohseide mit kleinen Verdickungen im Faden und weichem Glanz.</span></button><button class="tk" data-n="4" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/04-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/04-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>4</b> Kalkputz</span><span class="tk__s">Mineralischer Putz, leicht wolkig, ganz fein gekörnt. Fast keine Zeichnung, nur Tiefe.</span></button><button class="tk" data-n="5" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/05-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/05-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>5</b> Moiré</span><span class="tk__s">Seidenmoiré: wässrige Schlieren, die sich im Licht verschieben.</span></button><button class="tk" data-n="6" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/06-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/06-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>6</b> Rillen</span><span class="tk__s">Senkrechte Rillen im Relief, wie gefräste Holz- oder Gipsplatten. Modern, architektonisch.</span></button><button class="tk" data-n="7" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/07-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/07-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>7</b> Höhenlinien</span><span class="tk__s">Höhenlinien wie auf der Landeskarte rund um den Brienzersee. Feine Linie, kein Motiv.</span></button><button class="tk" data-n="8" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/08-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/08-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>8</b> Seespiegel</span><span class="tk__s">Kurze waagrechte Lichtstriche wie Sonne auf dem Wasser vor dem Haus.</span></button><button class="tk" data-n="9" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/09-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/09-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>9</b> Linien im Verlauf</span><span class="tk__s">Waagrechte Haarlinien, die enger und weiter werden. Ganz reduziert.</span></button><button class="tk" data-n="10" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/10-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/10-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>10</b> Raster</span><span class="tk__s">Ein Schweizer Raster aus Haarlinien, kleine Kreuze an den Knoten.</span></button><button class="tk" data-n="11" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/11-hell.webp);background-size:360px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/11-dunkel.webp);background-size:360px auto"></span><span class="tk__t"><b>11</b> Fächer</span><span class="tk__s">Art-déco-Fächer aus feinen Bögen, Schuppe über Schuppe. Elegant ohne Ornament.</span></button><button class="tk" data-n="12" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/12-hell.webp);background-size:384px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/12-dunkel.webp);background-size:384px auto"></span><span class="tk__t"><b>12</b> Fischgrat</span><span class="tk__s">Fischgrat aus Haarlinien, wie ein Parkett in Linie.</span></button><button class="tk" data-n="13" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/13-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/13-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>13</b> Wellenringe</span><span class="tk__s">Ringe im Wasser von wenigen Stellen aus, die sich überlagern und auslaufen.</span></button><button class="tk" data-n="14" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/14-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/14-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>14</b> Terrazzo</span><span class="tk__s">Ganz feiner Terrazzo, Splitter Ton in Ton. Wie ein Boden in der Halle, nur an der Wand.</span></button><button class="tk" data-n="15" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/15-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/15-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>15</b> Bouclé</span><span class="tk__s">Bouclé-Stoff mit kleinen Schlaufen, weich und tief.</span></button><button class="tk" data-n="16" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/16-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/16-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>16</b> Halbton</span><span class="tk__s">Punkte im Halbton, die in breiten Wellen grösser und kleiner werden.</span></button><button class="tk" data-n="17" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/17-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/17-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>17</b> Nadelstreifen</span><span class="tk__s">Doppelte Nadelstreifen auf Wollstoff, wie ein guter Anzug.</span></button><button class="tk" data-n="18" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/18-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/18-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>18</b> Bergkämme</span><span class="tk__s">Kämme der Berge über dem See als Linien hintereinander. Grafisch, modern.</span></button><button class="tk" data-n="19" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/19-hell.webp);background-size:384px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/19-dunkel.webp);background-size:384px auto"></span><span class="tk__t"><b>19</b> Steppung</span><span class="tk__s">Gesteppte Rauten wie gepolstertes Leder, mit feinem Stich in der Naht.</span></button><button class="tk" data-n="20" type="button"><span class="tk__f" style="background-image:url(_varianten/tapeten4/20-hell.webp);background-size:400px auto"></span><span class="tk__d" style="background-image:url(_varianten/tapeten4/20-dunkel.webp);background-size:400px auto"></span><span class="tk__t"><b>20</b> Lamellen</span><span class="tk__s">Waagrechte Lamellen mit weichem Licht, wie die Storen vor den Zimmern.</span></button></main>
