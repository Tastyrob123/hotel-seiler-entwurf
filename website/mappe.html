<script>
// Die Vorschläge der Mappe kommen aus der Vorlage (Carlton-Europe) und nennen eine Sauna, die es hier nicht gibt. Bis das Chat-Skript je Haus
// eigene Vorschläge bekommt, tauscht die Mappe sie hier gegen die Dinge des Seiler au Lac (Robert gemeldet, 10.10.2026).
(function () {
  var NEU = {'Sauna heizen lassen': 'Wann fährt das nächste Schiff?', 'Zimmerservice bestellen': 'Zimmerservice bestellen', 'Bis wann gibt es Frühstück?': 'Bis wann gibt es Frühstück?',
    'Was unternehme ich heute bei diesem Wetter?': 'Was unternehme ich heute bei diesem Wetter?', 'Wäsche abgeben': 'Tisch im «La Gare» reservieren', 'Taxi bestellen': 'Taxi bestellen'};
  var GRUSS = 'Grüezi und herzlich willkommen im Hotel Seiler au Lac. Ich bin für Sie da, solange Sie bei uns sind: Frühstück, Schiff und Postauto, Restaurants, Wetter, Taxi, Ausflüge. Fragen Sie einfach.';
  function tausche() {
    document.querySelectorAll('[data-mappe] button').forEach(function (b) { var t = b.textContent.trim(); if (!NEU[t] || NEU[t] === t) return; var k = [].slice.call(b.childNodes).find(function (n) { return n.nodeType === 3 && n.textContent.trim(); }); if (k) k.textContent = NEU[t]; else b.insertBefore(document.createTextNode(NEU[t]), b.firstChild); });
    document.querySelectorAll('[data-mappe] p, [data-mappe] div').forEach(function (el) { if (el.children.length === 0 && /Sauna, Zimmerservice/.test(el.textContent)) el.textContent = GRUSS; });
  }
  new MutationObserver(tausche).observe(document.body, { childList: true, subtree: true });
  tausche();
})();
</script>
