function gehen(){try{const d=f.contentDocument,e=ziel==='fuss'?d.querySelector('.fuss'):d.getElementById(ziel);if(e)f.contentWindow.scrollTo(0,e.getBoundingClientRect().top+f.contentWindow.scrollY)}catch(e){}}
f.addEventListener('load',()=>{legen();setTimeout(gehen,300)});
document.querySelectorAll('.tk').forEach(b=>b.onclick=()=>{n=b.dataset.n;legen();window.scrollTo({top:0,behavior:'smooth'})});
document.querySelectorAll('.wahl button').forEach(b=>b.onclick=()=>{ziel=b.dataset.z;document.querySelectorAll('.wahl button').forEach(x=>x.setAttribute('aria-pressed',x===b));gehen()});
legen();
</script></body></html>
